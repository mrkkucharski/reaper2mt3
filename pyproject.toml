[project]
name = "reaper2mt3"
version = "0.1.0"
description = "Render verified REAPER projects into aligned audio/MIDI training examples for MT3"
requires-python = ">=3.11"
dependencies = ["mido>=1.3", "numpy>=1.24"]

[project.scripts]
reaper2mt3 = "reaper2mt3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper2mt3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
